# Builds the Sossoldi Inspector (inspector/) at every push on main and puts the
# ready site (static files only) in the `site` branch, which any static host
# serves as it is: Cloudflare Pages, GitHub Pages ("deploy from a branch"),
# Netlify... with no build command and the branch root as output.
#
# The base href is "/" (the site at the root of a domain or subdomain). For a
# subfolder, e.g. sossoldi.example/inspector, set the repository variable
# INSPECTOR_BASE_HREF to "/inspector/" (Settings > Secrets and variables >
# Actions > Variables).

name: Inspector

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One build at a time; a newer push waits for the running one.
concurrency:
  group: inspector-site
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.8
          cache: true

      # A failing test leaves the published site as it was.
      - name: Test
        working-directory: inspector
        run: |
          flutter pub get
          flutter test

      - name: Build
        working-directory: inspector
        run: >-
          flutter build web --release
          --base-href "${{ vars.INSPECTOR_BASE_HREF || '/' }}"

      # The branch keeps only the last build (no history of past sites).
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: site
          publish_dir: inspector/build/web
          force_orphan: true
          commit_message: "Inspector site from ${{ github.sha }}"
